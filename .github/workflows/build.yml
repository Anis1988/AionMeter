name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test tests/AionMeter.Core.Tests -c Release

      - name: Publish
        run: >
          dotnet publish src/AionMeter/AionMeter.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish

      - name: Zip
        run: Compress-Archive -Path publish/* -DestinationPath AionMeter-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AionMeter-win-x64
          path: publish/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AionMeter-win-x64.zip
